<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find your dream property - Real estate listings with filters, map view, and inquiry forms">
    <title>Bproperty Clone - Real Estate Portal</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/listings.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                🏠 Bproperty<span>Clone</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#" data-scroll="listings">Buy</a></li>
                    <li><a href="#" data-scroll="listings">Rent</a></li>
                    <li><a href="#" data-scroll="listings">Sell</a></li>
                    <li><a href="#" id="contactLink">Contact</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <button class="btn btn-outline" id="loginBtn">Login</button>
                <button class="btn btn-primary" id="signupBtn">Sign Up</button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Find Your Dream Property</h1>
        <p>Discover thousands of properties for sale and rent across the country</p>
    </section>

    <!-- FILTERS -->
    <section class="search-section">
        <div class="filter-grid">
            <div class="filter-group">
                <label for="filterType">Property Type</label>
                <select id="filterType">
                    <option value="all">All Types</option>
                    <option value="Apartment">Apartment</option>
                    <option value="House">House</option>
                    <option value="Villa">Villa</option>
                    <option value="Condo">Condo</option>
                    <option value="Studio">Studio</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterPurpose">Purpose</label>
                <select id="filterPurpose">
                    <option value="all">Buy or Rent</option>
                    <option value="sale">For Sale</option>
                    <option value="rent">For Rent</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterBedrooms">Bedrooms</label>
                <select id="filterBedrooms">
                    <option value="all">Any</option>
                    <option value="1">1+</option>
                    <option value="2">2+</option>
                    <option value="3">3+</option>
                    <option value="4">4+</option>
                    <option value="5">5+</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterPrice">Max Price ($)</label>
                <input type="number" id="filterPrice" placeholder="e.g. 500000">
            </div>
            <div class="filter-group">
                <label for="filterLocation">Location</label>
                <select id="filterLocation">
                    <option value="all">All Locations</option>
                    <option value="New York">New York</option>
                    <option value="Los Angeles">Los Angeles</option>
                    <option value="Miami">Miami</option>
                    <option value="Chicago">Chicago</option>
                    <option value="Houston">Houston</option>
                    <option value="Seattle">Seattle</option>
                </select>
            </div>
        </div>
        <div class="search-actions">
            <button class="btn btn-primary" id="searchBtn">🔍 Search Properties</button>
            <button class="btn btn-outline-dark" id="resetBtn">Reset Filters</button>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <section class="listings-section" id="listingsSection">
            <h2>📋 Property Listings <span id="listingCount" class="count-badge"></span></h2>
            <div class="listings-grid" id="listingsGrid"></div>
        </section>

        <section class="map-section">
            <h2>🗺️ Map View</h2>
            <div id="map"></div>
        </section>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Property Details</h3>
                <button class="close-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© 2024 Bproperty Clone. All rights reserved. | Real Estate Portal Demo</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Modular JS -->
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/listings.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/map.js"></script>
    <script src="js/inquiry.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
